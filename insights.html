<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Insights · Repo Steward</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/logo-256.png">
  <link rel="stylesheet" href="/assets/steward.css">
  <style>
    .split { margin: 0 -20px; border-top: 1px solid var(--line); }
    .list { padding: 14px 20px 40px; min-width: 0; }
    .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    .pulses { border-top: 1px solid var(--line); }
    .pulses div { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12px; color: var(--ink-2); }
    .pulses div:hover, .pulses div.on { background: var(--panel-2); }
    .pulses div.on b { box-shadow: inset 3px 0 0 var(--signal); padding-left: 6px; }
    .pulses b { font: 600 11.5px var(--mono); color: var(--ink); }
    #themes td.rank { width: 1%; font: 700 15px var(--mono); color: var(--muted); text-align: right; }
    #themes tr[data-nav] { cursor: pointer; }
    #themes .sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    th[data-sort] { cursor: pointer; }
    th[data-sort]:hover { color: var(--ink); }
    th.sorted::after { content: " ↓"; color: var(--signal); }
    .pane .build { margin-top: 18px; border: 2px solid var(--rule); }
    .pane .build header { padding: 8px 12px; background: var(--ink); color: var(--bg); font: 700 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .pane .build .in { padding: 12px; }
    .pane .build p { margin: 0 0 10px; font-size: 12.5px; }
    .pane .result { margin-top: 10px; font-size: 12.5px; }
    .pane .result a { font-family: var(--mono); font-weight: 600; }
    .pane .intro { color: var(--ink-2); line-height: 1.6; }
    .pane .intro ol { padding-left: 18px; }
  </style>
</head>
<body data-page="insights">
  <main class="page" style="padding-bottom:0">
    <div class="page-head"><h1>Insights</h1><span class="sub" id="stamp">what is worth building next</span>
      <div class="tools"><span data-analysis-job="insights"></span></div></div>
    <div class="split">
      <div class="list">
        <div class="readout" id="readout"></div>
        <section class="panel">
          <div class="panel-head"><h2>Build candidates</h2><span class="count" id="count"></span><span class="hint">ranked by value, readiness and effort</span></div>
          <div class="toolbar">
            <select class="field" id="repo" aria-label="Repository"><option value="">all repositories</option></select>
            <select class="field" id="ready" aria-label="Readiness"><option value="">any readiness</option><option>ready</option><option>needs-design</option><option>blocked</option></select>
            <input class="field" id="q" type="search" data-filter-input placeholder="filter themes  /" style="flex:1;min-width:160px">
          </div>
          <div class="tablewrap"><table class="grid" id="themes"><thead><tr>
            <th data-sort="rank" class="sorted">#</th><th>Theme</th><th data-sort="value">Value</th><th data-sort="readiness">Ready</th><th data-sort="effort">Effort</th><th>Cost</th><th>State</th>
          </tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">loading…</td></tr></tbody></table></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Repository pulse</h2></div>
          <div class="pulses" id="pulses"></div>
        </section>
        <section class="panel" id="builds-panel" hidden>
          <div class="panel-head"><h2>Earlier builds</h2><span class="count" id="builds-count"></span><span class="hint">themes no longer in the current list</span></div>
          <div class="tablewrap"><table class="grid"><thead><tr><th>Repo</th><th>Theme</th><th>State</th><th>PR</th><th>When</th></tr></thead><tbody id="builds"></tbody></table></div>
        </section>
      </div>
      <aside class="pane" id="detail"></aside>
    </div>
  </main>
  <script src="/assets/steward-shell.js"></script>
  <script>
  (function(){
    var S=Steward,esc=S.esc,graph=null,builds={},active=null,sortKey='rank',poll=null;
    var $=function(id){return document.getElementById(id)};
    var STATUS={queued:['info','queued'],building:['info','building'],'pr-open':['ok','PR open'],blocked:['warn','blocked'],failed:['crit','failed']};
    var READY={ready:['ok','ready'],'needs-design':['warn','design'],blocked:['crit','blocked']};
    var ORDER={ready:0,'needs-design':1,blocked:2},EFFORT={tiny:0,small:1,medium:2,large:3};
    function short(n){return String(n||'').split('/').pop()}
    function meter(n){return '<span class="meter" title="value '+n+'/5">'+'■■■■■'.slice(0,n)+'<i>'+'■■■■■'.slice(0,5-n)+'</i></span>'}
    function st(pair,text){return '<span class="st '+pair[0]+'">'+esc(text||pair[1])+'</span>'}
    function buildChip(b){return b?st(STATUS[b.status]||['',b.status]):'<span class="muted">·</span>'}
    function busy(){return Object.keys(builds).some(function(k){return builds[k].status==='queued'||builds[k].status==='building'})}

    function intro(){
      $('detail').innerHTML='<span class="label">How this works</span><h2>Pick a theme, then build it</h2><div class="intro"><ol>'+
        '<li><b>Run build sweep</b> reads every open issue and PR from GitHub, then ranks what is worth building.</li>'+
        '<li>A theme is one buildable change grounded in open issues, with a brief: goal, acceptance criteria, likely files and open questions.</li>'+
        '<li><b>Build</b> runs one steward session. It implements the brief in its own clone, runs the tests and opens a PR. It never merges.</li></ol>'+
        '<p class="muted">Keys: <kbd>j</kbd> <kbd>k</kbd> move, <kbd>enter</kbd> open, <kbd>/</kbd> filter.</p></div>';
    }

    function filtered(){
      var repo=$('repo').value,ready=$('ready').value,q=$('q').value.trim().toLowerCase();
      var rows=(graph?graph.themes:[]).filter(function(t){
        if(repo&&t.repo!==repo)return false;
        if(ready&&t.readiness!==ready)return false;
        return !q||[t.title,t.summary,t.repo,t.kind].join(' ').toLowerCase().indexOf(q)!==-1;
      });
      var key={rank:function(t){return t.rank},value:function(t){return -t.value_score*10+t.rank/100},
        readiness:function(t){return ORDER[t.readiness]*100+t.rank},effort:function(t){return EFFORT[t.effort]*100+t.rank}}[sortKey];
      return rows.sort(function(a,b){return key(a)-key(b)});
    }

    function render(){
      if(!graph){
        $('rows').innerHTML='<tr><td colspan="7" class="empty">No build-candidate list yet. Use Run build sweep above, or make insights.</td></tr>';
        $('readout').innerHTML='';renderBuilds();return;
      }
      var all=graph.themes,rows=filtered();
      $('readout').innerHTML=[['Themes',all.length],['Ready to build',all.filter(function(t){return t.readiness==='ready'}).length,true],
        ['Needs design',all.filter(function(t){return t.readiness==='needs-design'}).length],
        ['Building',Object.keys(builds).filter(function(k){return /queued|building/.test(builds[k].status)}).length],
        ['PRs opened',Object.keys(builds).filter(function(k){return builds[k].status==='pr-open'}).length],
        ['Repos covered',new Set(all.map(function(t){return t.repo})).size]]
        .map(function(c){return '<div class="'+(c[2]&&c[1]?'sig':'')+'"><span class="label">'+c[0]+'</span><b>'+c[1]+'</b></div>'}).join('');
      $('count').textContent=rows.length===all.length?all.length:rows.length+'/'+all.length;
      $('rows').innerHTML=rows.map(function(t){
        return '<tr data-nav data-id="'+esc(t.id)+'"'+(active===t.id?' class="sel"':'')+'><td class="rank">'+t.rank+'</td>'+
          '<td><span class="title">'+esc(t.title)+'</span><span class="sub">'+esc(t.summary)+'</span>'+
          '<span class="sub"><span class="tag">'+esc(short(t.repo))+'</span> <span class="tag">'+esc(t.kind)+'</span> '+
          t.issues.map(function(n){return '<span class="tag">#'+n+'</span>'}).join(' ')+'</span></td>'+
          '<td class="w-id">'+meter(t.value_score)+'</td><td class="w-id">'+st(READY[t.readiness]||['',t.readiness])+'</td>'+
          '<td class="w-id mono">'+esc(t.effort)+'</td><td class="w-id mono">'+esc(t.build_cost)+'</td><td class="w-id">'+buildChip(builds[t.id])+'</td></tr>'
      }).join('')||'<tr><td colspan="7" class="empty">No themes match this filter.</td></tr>';
      $('pulses').innerHTML=graph.repositories.filter(function(r){return r.pulse}).map(function(r){
        return '<div data-repo="'+esc(r.name)+'"'+($('repo').value===r.name?' class="on"':'')+'><b>'+esc(short(r.name))+'</b><span>'+esc(r.pulse)+'</span></div>'}).join('')||'<div class="empty">No pulse lines in this sweep.</div>';
      renderBuilds();
      if(active)select(active,true);
    }

    function renderBuilds(){
      var current={};(graph?graph.themes:[]).forEach(function(t){current[t.id]=1});
      var rows=Object.keys(builds).map(function(k){return builds[k]}).filter(function(b){return !current[b.theme_id]})
        .sort(function(a,b){return (b.requested_at||'').localeCompare(a.requested_at||'')});
      $('builds-panel').hidden=!rows.length;$('builds-count').textContent=rows.length;
      $('builds').innerHTML=rows.map(function(b){return '<tr><td class="w-id mono">'+esc(short(b.repo))+'</td><td><span class="title">'+esc(b.title)+'</span>'+(b.summary?'<span class="sub">'+esc(b.summary)+'</span>':'')+'</td>'+
        '<td class="w-id">'+buildChip(b)+'</td><td class="w-id">'+(b.pr_url?'<a href="'+esc(b.pr_url)+'" target="_blank" rel="noopener">'+esc(b.pr_url.split('github.com/')[1])+'</a>':'<span class="muted">—</span>')+'</td>'+
        '<td class="w-id num">'+esc(S.stamp(b.finished_at||b.requested_at).slice(0,10))+'</td></tr>'}).join('');
    }

    function select(id,quiet){
      var t=(graph?graph.themes:[]).filter(function(x){return x.id===id})[0];if(!t)return;active=id;
      if(!quiet)Array.prototype.forEach.call(document.querySelectorAll('#rows tr[data-nav]'),function(r){r.classList.toggle('sel',r.dataset.id===id)});
      var b=builds[id],br=t.brief,running=b&&(b.status==='queued'||b.status==='building'),open=b&&b.status==='pr-open';
      var label=running?STATUS[b.status][1]+'…':open?'PR open':b&&(b.status==='failed'||b.status==='blocked')?'Build again':'Build';
      var note=open?'A PR is open for this theme. Review and merge it on GitHub.':running?'The steward is working on this theme. This pane updates on its own.':
        t.readiness==='ready'?'Opens a PR that implements this brief. One steward session, billed like a tick. It never merges.':
        'Marked <b>'+esc(t.readiness)+'</b>: the builder stops and reports the open questions rather than guess.';
      $('detail').innerHTML='<span class="label">#'+t.rank+' · '+esc(t.repo)+' · '+esc(t.kind)+'</span><h2>'+esc(t.title)+'</h2><p>'+esc(t.summary)+'</p>'+
        '<div class="build"><header>Build</header><div class="in"><p>'+note+'</p>'+
        '<button class="btn '+(running||open?'':'sig')+' lg block" id="build"'+(running||open?' disabled':'')+'>'+esc(label)+'</button>'+
        (b?'<div class="result">'+buildChip(b)+' '+(b.pr_url?'<a href="'+esc(b.pr_url)+'" target="_blank" rel="noopener">'+esc(b.pr_url.split('github.com/')[1])+(b.draft?' (draft)':'')+' ↗</a>':'')+
          (b.summary?'<p style="margin:6px 0 0">'+esc(b.summary)+'</p>':'')+
          (b.blockers&&b.blockers.length?'<ul>'+b.blockers.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+'</div>':'')+
        '</div></div>'+
        '<h3>Assessment</h3><dl class="kv"><dt>Value</dt><dd>'+meter(t.value_score)+' '+esc(t.value)+'</dd>'+
        '<dt>Readiness</dt><dd>'+st(READY[t.readiness]||['',t.readiness])+' '+esc(t.readiness_note)+'</dd>'+
        '<dt>Effort</dt><dd class="mono">'+esc(t.effort)+'</dd><dt>Build cost</dt><dd class="mono">'+esc(t.build_cost)+'</dd><dt>Risk</dt><dd>'+esc(t.risk)+'</dd></dl>'+
        '<h3>Brief</h3><p>'+esc(br.goal)+'</p><h3>Acceptance</h3><ul>'+br.acceptance.map(function(a){return '<li>'+esc(a)+'</li>'}).join('')+'</ul>'+
        (br.likely_files.length?'<h3>Likely files</h3><ul>'+br.likely_files.map(function(f){return '<li><code>'+esc(f)+'</code></li>'}).join('')+'</ul>':'')+
        (br.open_questions.length?'<h3>Open questions</h3><ul>'+br.open_questions.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ul>':'')+
        '<h3>Evidence</h3>'+t.evidence.map(function(e){return '<a class="ref" href="'+esc(e.url)+'" target="_blank" rel="noopener"><b>#'+e.number+' '+esc(e.title)+'</b><span>'+e.reactions+' reactions · '+e.participants+' people · '+e.comments+' comments · updated '+esc(S.ago(e.updated_at))+'</span></a>'}).join('');
      var btn=$('build');if(btn&&!btn.disabled)btn.addEventListener('click',function(){build(t)});
      try{history.replaceState(null,'','?theme='+encodeURIComponent(id))}catch(e){}
    }

    function build(t){
      S.modal({title:'Build: '+t.title,tone:'sig',confirm:'Build',input:'optional note for the builder (e.g. keep the setting out of the UI for now)',
        body:'<p>A steward session implements the brief in its own clone of <b>'+esc(t.repo)+'</b>, runs the tests and opens a PR. It never merges.</p>'})
      .then(function(note){
        if(note===false)return;
        S.api('/api/build',{theme_id:t.id,note:typeof note==='string'?note:''}).then(function(x){
          builds=x.builds||{};render();select(t.id);watch();S.toast('Build queued: '+t.title,'ok');
        }).catch(function(e){S.toast(e.message,'error')});
      });
    }

    function load(){return S.api('/api/insights').then(function(x){graph=x.insights;builds=x.builds||{};
      $('stamp').textContent=graph?'ranked '+S.ago(graph.generated_at)+' · '+S.stamp(graph.generated_at)+' · from a GitHub snapshot':'no list yet'})}
    function watch(){if(poll)return;poll=setInterval(function(){load().then(function(){render();if(!busy()){clearInterval(poll);poll=null}})},8000)}

    ['repo','ready'].forEach(function(id){$(id).addEventListener('change',render)});
    $('q').addEventListener('input',render);
    $('rows').addEventListener('click',function(e){var tr=e.target.closest('tr[data-nav]');if(tr)select(tr.dataset.id)});
    $('pulses').addEventListener('click',function(e){var d=e.target.closest('[data-repo]');if(!d)return;$('repo').value=$('repo').value===d.dataset.repo?'':d.dataset.repo;render()});
    Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'),function(th){th.addEventListener('click',function(){
      sortKey=th.dataset.sort;document.querySelectorAll('th[data-sort]').forEach(function(x){x.classList.toggle('sorted',x===th)});render()})});
    S.nav({rows:function(){return Array.prototype.slice.call(document.querySelectorAll('#rows tr[data-nav]'))},select:function(r){select(r.dataset.id)},open:function(r){select(r.dataset.id);var b=$('build');if(b)b.focus()}});
    intro();
    load().then(function(){
      if(graph)graph.repositories.forEach(function(r){var o=document.createElement('option');o.value=r.name;o.textContent=short(r.name)+(r.open_issues?' ('+r.open_issues+')':'');$('repo').appendChild(o)});
      var p=new URLSearchParams(location.search),want=p.get('repo');
      if(want&&graph){var m=graph.repositories.filter(function(r){return r.name===want||short(r.name)===want})[0];if(m)$('repo').value=m.name}
      render();if(p.get('theme'))select(p.get('theme'));if(busy())watch();
    }).catch(function(e){$('rows').innerHTML='<tr><td colspan="7" class="empty">'+esc(e.message)+'</td></tr>'});
  })();
  </script>
  <script src="/assets/analysis-run.js"></script>
</body>
</html>
