<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit · Repo Steward</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/logo-256.png">
<link rel="stylesheet" href="/assets/steward.css">
<style>
  .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .toolbar input[type=search] { flex: 1; min-width: 180px; }
  #events td.t { width: 1%; white-space: nowrap; font-family: var(--mono); color: var(--muted); }
  #events td.ev { width: 1%; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }
  #events td.where { max-width: 240px; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
  #events .d { display: block; font: 11px/1.45 var(--mono); color: var(--muted); margin-top: 2px; word-break: break-word; }
  #events tr[data-row] { cursor: pointer; }
</style>
</head>
<body data-page="audit">
<main class="page">
  <div class="page-head"><h1>Audit</h1><span class="sub">append-only decision log: everything you, the steward and the system did</span>
    <div class="tools">
      <a class="btn ghost" href="/audit.jsonl" download="audit.jsonl" title="The raw append-only log, one JSON event per line">↓ audit.jsonl</a>
      <button class="btn ghost" id="dl-csv" title="The events currently shown, as CSV">↓ Filtered CSV</button>
    </div>
  </div>
  <div class="readout" id="tiles"><div><span class="label">Loading</span><b>…</b></div></div>
  <section class="panel">
    <div class="panel-head"><h2>Events</h2><span class="count" id="count"></span></div>
    <div class="toolbar">
      <select class="field" id="f-actor"></select>
      <select class="field" id="f-event"></select>
      <select class="field" id="f-repo"></select>
      <input class="field" id="f-date" type="date" title="Filter to one day; clear to see all">
      <input class="field" id="f-q" type="search" data-filter-input placeholder="search summaries, details, refs  /">
    </div>
    <div class="tablewrap"><table class="grid" id="events"><thead><tr><th>Time</th><th>Actor</th><th>Event</th><th>Where</th><th>What</th></tr></thead><tbody id="list"><tr><td colspan="5" class="empty">loading…</td></tr></tbody></table></div>
  </section>
</main>
<script src="/assets/steward-shell.js"></script>
<script>
(function () {
  var LIMIT = 2000, events = [], esc = Steward.esc;
  var TONE = { maintainer: 'solid', steward: 'info', system: '' };
  var $ = function (id) { return document.getElementById(id); };

  function filtered() {
    var a = $('f-actor').value, e = $('f-event').value, r = $('f-repo').value, d = $('f-date').value;
    var q = $('f-q').value.trim().toLowerCase();
    return events.filter(function (ev) {
      if (a && ev.actor !== a) return false;
      if (e && ev.event !== e) return false;
      if (r && ev.repo !== r) return false;
      if (d && (ev.ts || '').slice(0, 10) !== d) return false;
      if (q && [ev.summary, ev.detail, ev.repo, ev.ref, ev.event].join(' ').toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).slice().reverse();
  }

  function row(e, i) {
    var failed = e.ok === false, kind = e.data && e.data.kind ? ' · ' + e.data.kind : '';
    var where = e.repo ? esc(e.repo) + (e.ref ? ' ' + (e.url ? '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.ref) + '</a>' : esc(e.ref)) : '') : '<span class="muted">—</span>';
    return '<tr data-row data-nav data-i="' + i + '"><td class="t">' + esc((e.ts || '').slice(11, 19)) + '</td>' +
      '<td class="w-id"><span class="st ' + (TONE[e.actor] || '') + '">' + esc(e.actor || '?') + '</span></td>' +
      '<td class="ev">' + esc(e.event || '?') + esc(kind) + (failed ? ' <span class="st crit">failed</span>' : '') +
      (e.via ? '<span class="d">via ' + esc(e.via) + '</span>' : '') + '</td>' +
      '<td class="where">' + where + '</td>' +
      '<td>' + esc(e.summary || '') + (e.detail && e.detail !== e.summary ? '<span class="d">' + esc(e.detail) + '</span>' : '') + '</td></tr>';
  }

  var shown = [];
  function render() {
    shown = filtered();
    var out = [], lastDay = null;
    shown.forEach(function (e, i) {
      var day = (e.ts || '').slice(0, 10);
      if (day !== lastDay) { out.push('<tr class="group"><td colspan="5">' + esc(day || 'undated') + '</td></tr>'); lastDay = day; }
      out.push(row(e, i));
    });
    $('list').innerHTML = out.join('') ||
      '<tr><td colspan="5" class="empty">No events match. Clear the date to see every day; <code>make audit-backfill</code> folds in older history.</td></tr>';
    $('count').textContent = shown.length + ' / ' + events.length + (events.length >= LIMIT ? ' (latest ' + LIMIT + ')' : '');
  }

  function toggle(tr) {
    var next = tr.nextElementSibling;
    if (next && next.classList.contains('detail')) { next.remove(); return; }
    var d = document.createElement('tr');
    d.className = 'detail';
    d.innerHTML = '<td colspan="5"><pre></pre></td>';
    d.querySelector('pre').textContent = JSON.stringify(shown[+tr.dataset.i], null, 2);
    tr.parentNode.insertBefore(d, next);
  }
  $('list').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-row]');
    if (tr && !e.target.closest('a')) toggle(tr);
  });
  Steward.nav({ rows: function () { return Array.prototype.slice.call(document.querySelectorAll('#list tr[data-nav]')); }, open: toggle });

  function tiles() {
    var by = { maintainer: 0, steward: 0, system: 0 }, merges = 0, decisions = 0, builds = 0, failures = 0;
    events.forEach(function (e) {
      if (by[e.actor] != null) by[e.actor]++;
      if ((e.event === 'approve' && e.data && e.data.merged) ||
          (e.event === 'terminal' && e.data && e.data.action === 'merge' && e.ok !== false)) merges++;
      if (e.event === 'decision_recorded') decisions++;
      if (e.event === 'build_done' && e.ok) builds++;
      if (e.ok === false) failures++;
    });
    $('tiles').innerHTML = [['Events', events.length], ['By you', by.maintainer], ['By the steward', by.steward],
      ['Merges', merges], ['Decisions typed', decisions], ['Builds opened', builds], ['Failed', failures, failures > 0]]
      .map(function (t) { return '<div class="' + (t[2] ? 'sig' : '') + '"><span class="label">' + t[0] + '</span><b>' + t[1] + '</b></div>'; }).join('');
  }

  $('dl-csv').addEventListener('click', function () {
    var cols = ['ts', 'actor', 'via', 'event', 'repo', 'ref', 'ok', 'summary', 'detail'];
    function cell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var lines = [cols.join(',')].concat(filtered().map(function (e) { return cols.map(function (c) { return cell(e[c]); }).join(','); }));
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n') + '\n'], { type: 'text/csv' }));
    a.download = 'decision-log.csv'; a.click(); URL.revokeObjectURL(a.href);
  });

  Steward.api('/api/audit?limit=' + LIMIT).then(function (res) {
    events = res.events || [];
    function fill(id, label, key) {
      var seen = {}, vals = events.map(function (e) { return e[key]; })
        .filter(function (v) { return v && !seen[v] && (seen[v] = 1); }).sort();
      $(id).innerHTML = '<option value="">' + label + '</option>' + vals.map(function (v) { return '<option>' + esc(v) + '</option>'; }).join('');
      $(id).addEventListener('change', render);
    }
    fill('f-actor', 'all actors', 'actor'); fill('f-event', 'all events', 'event'); fill('f-repo', 'all repos', 'repo');
    $('f-date').value = new Date().toISOString().slice(0, 10);
    $('f-date').addEventListener('change', render);
    $('f-q').addEventListener('input', render);
    tiles(); render();
  }).catch(function () {
    $('list').innerHTML = '<tr><td colspan="5" class="empty">API unreachable: this page needs server.py.</td></tr>';
    $('tiles').innerHTML = '';
  });
})();
</script>
</body></html>
