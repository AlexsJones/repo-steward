<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Self-evaluation · Repo Steward</title><link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<style>
:root{--bg:#EFF2F0;--panel:#FBFCFB;--panel2:#F3F6F4;--ink:#1C2321;--muted:#5C6B66;--line:#D8DFDB;--accent:#175E54;--soft:#E3EEEB;--ok:#0B7D5E;--oksoft:#DFF0E9;--warn:#A66A1E;--warnsoft:#F5ECDC;--crit:#A32F26;--critsoft:#F6E3E1}
@media(prefers-color-scheme:dark){:root{--bg:#111614;--panel:#181F1C;--panel2:#1D2622;--ink:#E4EAE7;--muted:#8CA097;--line:#2A342F;--accent:#4FB39F;--soft:#1B322D;--ok:#39B990;--oksoft:#14302A;--warn:#D19A4A;--warnsoft:#33281A;--crit:#E0736A;--critsoft:#37211F}}
*{box-sizing:border-box}body{margin:0;padding:0 20px 70px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}main{max-width:1160px;margin:auto}header{display:flex;align-items:center;gap:14px;padding:27px 0 18px;border-bottom:2px solid var(--accent);margin-bottom:26px}h1{font:600 27px "Iowan Old Style",Palatino,Georgia,serif;margin:0}.spacer{flex:1}.nav{font:600 12px ui-monospace,Menlo,monospace}.chip{display:inline-block;border-radius:99px;background:var(--panel2);padding:3px 9px;color:var(--muted);font:600 10.5px ui-monospace,Menlo,monospace}.hero{border-left:4px solid var(--accent);background:var(--panel);border-radius:9px;padding:20px 22px;margin-bottom:28px}.hero h2{font-size:20px;margin:6px 0}.hero p{max-width:80ch;color:var(--muted);margin:0}.meta{font-size:11px;color:var(--muted);margin-top:12px}section{margin:30px 0}section>h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:11px}.card{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:15px}.card h3{font-size:14px;margin:5px 0}.card p{color:var(--muted);margin:0}.improving,.supported{color:var(--ok)}.needs-attention,.contradicted{color:var(--crit)}.mixed{color:var(--warn)}.finding{margin-bottom:10px}.finding summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:flex-start}.finding summary::-webkit-details-marker{display:none}.finding summary h3{margin:0;flex:1}.finding-body{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.finding-body h4{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}.finding-body p{margin:0;color:var(--muted)}.wide{grid-column:1/-1}.evidence{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ev{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:5px 8px;font-size:11px}.lesson{border-left:3px solid var(--accent)}.empty{text-align:center;padding:70px;color:var(--muted)}code{background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:4px}@media(max-width:650px){.finding-body{grid-template-columns:1fr}.wide{grid-column:auto}header{flex-wrap:wrap}}
</style><link rel="stylesheet" href="/assets/site-nav.css"></head><body><main>
<header class="site-header"><h1>Self-evaluation</h1><span class="chip">critical review loop</span><span class="spacer"></span><nav class="site-nav" aria-label="Primary navigation"><a href="/dashboard.html">Operations</a><a href="/insights.html">Insights</a><a href="/evaluation.html" aria-current="page">Self-evaluation</a><a href="/metrics.html">Metrics</a><a href="/audit.html">Audit</a></nav></header>
<div id="app"><div class="empty">Loading the latest evaluation…</div></div>
</main><script>
(function(){var app=document.getElementById('app');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function ev(ids,evidence){return '<div class="evidence">'+(ids||[]).map(function(id){var s=evidence[id]||{},a=s.attributes||{},e=(s.evidence||[])[0]||{},label=e.label||a.title||(a.summary||id),url=e.url||'';return (url?'<a':'<span')+' class="ev" '+(url?'href="'+esc(url)+'" target="_blank" rel="noopener"':'')+'>'+esc(label)+'</'+(url?'a':'span')+'>'}).join('')+'</div>'}fetch('/api/evaluation').then(function(r){return r.json()}).then(function(x){var r=x.evaluation;if(!r){app.innerHTML='<div class="empty"><h2>No self-evaluation yet</h2><p>Run <code>make evaluate</code> after the steward has accumulated outcomes.</p></div>';return}var out='<div class="hero"><span class="chip '+esc(r.posture)+'">'+esc(r.posture)+'</span><h2>How well is the steward judging the work?</h2><p>'+esc(r.summary)+'</p><div class="meta">Generated '+esc(r.generated_at.replace('T',' ').replace('Z',' UTC'))+' · '+x.runs+' evaluation run'+(x.runs===1?'':'s')+' retained</div></div>';out+='<section><h2>Evaluation dimensions</h2><div class="grid">'+r.dimensions.map(function(d){return '<div class="card"><span class="chip '+esc(d.status)+'">'+esc(d.status)+'</span><h3>'+esc(d.title)+'</h3><p>'+esc(d.summary)+'</p>'+ev(d.signal_ids,x.evidence)+'</div>'}).join('')+'</div></section>';out+='<section><h2>Critical findings · '+r.findings.length+'</h2>'+r.findings.map(function(f){return '<details class="card finding"><summary><span class="chip '+esc(f.assessment)+'">'+esc(f.assessment)+'</span><h3>'+esc(f.title)+'</h3><span class="chip">'+esc(f.confidence)+'</span></summary><div class="finding-body"><div><h4>Original judgment</h4><p>'+esc(f.original_judgment)+'</p></div><div><h4>Observed outcome</h4><p>'+esc(f.observed_outcome)+'</p></div><div><h4>Critique</h4><p>'+esc(f.critique)+'</p></div><div><h4>Change next time</h4><p>'+esc(f.recommendation)+'</p></div><div class="wide"><span class="chip">'+esc(f.repo)+'</span>'+ev(f.signal_ids,x.evidence)+'</div></div></details>'}).join('')+'</section>';out+='<section><h2>Lessons fed into future ticks · '+r.lessons.length+'</h2><div class="grid">'+r.lessons.map(function(l){return '<div class="card lesson"><span class="chip">'+esc(l.repo)+'</span><h3>'+esc(l.guidance)+'</h3><p>Apply when: '+esc(l.applies_to)+'</p><div class="meta">'+esc(l.confidence)+' confidence · '+esc(l.finding_keys.join(', '))+'</div></div>'}).join('')+'</div></section>';app.innerHTML=out}).catch(function(){app.innerHTML='<div class="empty">Could not load the self-evaluation.</div>'})})();
</script></body></html>
