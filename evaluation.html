<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluation · Repo Steward</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/logo-256.png">
<link rel="stylesheet" href="/assets/steward.css">
<style>
.hero{border:1px solid var(--line);border-left:3px solid var(--rule);background:var(--panel);padding:14px 16px;margin-bottom:16px}
.hero h2{font:700 16px/1.3 var(--sans);margin:8px 0 6px}.hero p{max-width:90ch;color:var(--ink-2);margin:0}.meta{font:11px var(--mono);color:var(--muted);margin-top:10px}
section.block{margin-bottom:18px}section.block>h2{font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;margin:0;border:1px solid var(--line);border-bottom:0;background:var(--panel-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.card{border:1px solid var(--line);border-top:0;border-left:0;background:var(--panel);padding:12px 14px}.card h3{font-size:13.5px;margin:6px 0 4px}.card p{color:var(--ink-2);margin:0}
.chip{display:inline-block;padding:2px 5px;font:700 10px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;border:1px solid currentColor;color:var(--muted)}
.chip.improving,.chip.supported{color:var(--ok);background:var(--ok-soft)}.chip.needs-attention,.chip.contradicted{color:var(--crit);background:var(--crit-soft)}.chip.mixed{color:var(--warn);background:var(--warn-soft)}
.findings{border:1px solid var(--line);border-top:0}.finding{border:0;border-bottom:1px solid var(--line)}.finding:last-child{border-bottom:0}
.finding summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;padding:10px 12px}.finding summary::-webkit-details-marker{display:none}.finding summary:hover{background:var(--panel-2)}
.finding summary h3{margin:0;flex:1;font-size:13px}.finding[open] summary{background:var(--panel-2);border-bottom:1px solid var(--line)}
.finding-body{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.finding-body h4{font:700 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 5px}.finding-body p{margin:0;color:var(--ink-2)}.wide{grid-column:1/-1}
.evidence{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.ev{border:1px solid var(--line);background:var(--panel-2);padding:3px 7px;font:11px var(--mono);text-decoration:none}
.lesson{border-left:3px solid var(--signal)!important}.empty h2{font:700 13px var(--mono);margin-bottom:6px}
@media(max-width:650px){.finding-body{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head>
<body data-page="evaluation"><main class="page">
<div class="page-head"><h1>Evaluation</h1><span class="sub">the steward critically reviews its own past judgments and turns them into lessons</span><div class="tools"><span data-analysis-job="evaluation"></span></div></div>
<div id="app"><div class="empty">Loading the latest evaluation…</div></div>
</main>
<script src="/assets/steward-shell.js"></script>
<script>
(function(){var app=document.getElementById('app');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function ev(ids,evidence){return '<div class="evidence">'+(ids||[]).map(function(id){var s=evidence[id]||{},a=s.attributes||{},e=(s.evidence||[])[0]||{},label=e.label||a.title||(a.summary||id),url=e.url||'';return (url?'<a':'<span')+' class="ev" '+(url?'href="'+esc(url)+'" target="_blank" rel="noopener"':'')+'>'+esc(label)+'</'+(url?'a':'span')+'>'}).join('')+'</div>'}fetch('/api/evaluation').then(function(r){return r.json()}).then(function(x){var r=x.evaluation;if(!r){app.innerHTML='<div class="empty"><h2>No self-evaluation yet</h2><p>Use <b>Run self-evaluation</b> above (or <code>make evaluate</code>) once the steward has accumulated outcomes.</p></div>';return}var out='<div class="hero"><span class="chip '+esc(r.posture)+'">'+esc(r.posture)+'</span><h2>How well is the steward judging the work?</h2><p>'+esc(r.summary)+'</p><div class="meta">Generated '+esc(r.generated_at.replace('T',' ').replace('Z',' UTC'))+' · '+x.runs+' evaluation run'+(x.runs===1?'':'s')+' retained</div></div>';out+='<section class="block"><h2>Evaluation dimensions</h2><div class="grid">'+r.dimensions.map(function(d){return '<div class="card"><span class="chip '+esc(d.status)+'">'+esc(d.status)+'</span><h3>'+esc(d.title)+'</h3><p>'+esc(d.summary)+'</p>'+ev(d.signal_ids,x.evidence)+'</div>'}).join('')+'</div></section>';out+='<section class="block"><h2>Critical findings · '+r.findings.length+'</h2><div class="findings">'+r.findings.map(function(f){return '<details class="finding"><summary><span class="chip '+esc(f.assessment)+'">'+esc(f.assessment)+'</span><h3>'+esc(f.title)+'</h3><span class="chip">'+esc(f.confidence)+'</span></summary><div class="finding-body"><div><h4>Original judgment</h4><p>'+esc(f.original_judgment)+'</p></div><div><h4>Observed outcome</h4><p>'+esc(f.observed_outcome)+'</p></div><div><h4>Critique</h4><p>'+esc(f.critique)+'</p></div><div><h4>Change next time</h4><p>'+esc(f.recommendation)+'</p></div><div class="wide"><span class="chip">'+esc(f.repo)+'</span>'+ev(f.signal_ids,x.evidence)+'</div></div></details>'}).join('')+'</div></section>';out+='<section class="block"><h2>Lessons fed into future ticks · '+r.lessons.length+'</h2><div class="grid">'+r.lessons.map(function(l){return '<div class="card lesson"><span class="chip">'+esc(l.repo)+'</span><h3>'+esc(l.guidance)+'</h3><p>Apply when: '+esc(l.applies_to)+'</p><div class="meta">'+esc(l.confidence)+' confidence · '+esc(l.finding_keys.join(', '))+'</div></div>'}).join('')+'</div></section>';app.innerHTML=out}).catch(function(){app.innerHTML='<div class="empty">Could not load the self-evaluation.</div>'})})();
</script>
<script src="/assets/analysis-run.js"></script>
</body></html>
