<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Repo Steward logo">
  <!-- Neo-industrial mark: an ink plate carrying two interlinked commit rings,
       one off-white and one safety orange, with square commit nodes. -->
  <rect width="256" height="256" fill="#141413"/>

  <!-- ring A (off-white) -->
  <circle cx="104" cy="128" r="46" fill="none" stroke="#E9E9E4" stroke-width="18"/>
  <!-- ring B (signal) drawn over A -->
  <circle cx="152" cy="128" r="46" fill="none" stroke="#E04E0B" stroke-width="18"/>
  <!-- weave: ring A back on top at the lower crossing -->
  <path d="M141.5 156.4 A46 46 0 0 1 113.5 172.7" fill="none" stroke="#E9E9E4" stroke-width="18" stroke-linecap="butt"/>

  <!-- square commit nodes -->
  <rect x="42" y="112" width="32" height="32" fill="#E9E9E4"/>
  <rect x="52" y="122" width="12" height="12" fill="#141413"/>
  <rect x="182" y="112" width="32" height="32" fill="#E04E0B"/>
  <rect x="192" y="122" width="12" height="12" fill="#141413"/>
</svg>
